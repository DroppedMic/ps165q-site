<!--
  Decap CMS (formerly Netlify CMS) admin entry point.

  Loads the CMS bundle from a CDN. The CMS reads its config from
  ./config.yml in this folder, which points at the Markdown collections
  in src/content/ via a GitHub backend.

  To enable in production:
    1. Push this repo to GitHub (already done).
    2. In the repo settings, install the Decap CMS OAuth app
       (https://decapcms.org/docs/github-backend/), or run a small
       OAuth proxy (e.g. Cloudflare Worker).
    3. Visit /ps165q-site/admin/ and click "Login with GitHub".

  Staff members granted GitHub write access can then edit content
  through the visual editor without touching code.
-->
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
